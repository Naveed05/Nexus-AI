name: NEXUS Container Build

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/web/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/container-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/container-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t nexus-ai:test .

      - name: Inspect image
        run: docker image inspect nexus-ai:test

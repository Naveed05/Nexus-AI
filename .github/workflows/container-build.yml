name: NEXUS Container Build

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/container-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/container-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t nexus-ai:test .

      - name: Inspect image
        run: docker image inspect nexus-ai:test

      - name: Run container smoke test
        run: |
          docker run -d --name nexus-ai-smoke -p 8000:8000 nexus-ai:test
          trap 'docker logs nexus-ai-smoke || true; docker rm -f nexus-ai-smoke || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/tmp/nexus-ready.json; then
              cat /tmp/nexus-ready.json
              exit 0
            fi
            sleep 2
          done
          echo "NEXUS container did not become ready"
          exit 1
